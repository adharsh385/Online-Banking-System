<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Account Management')}"></head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-3 col-lg-2 p-0">
            <div th:replace="~{fragments/sidebar :: adminSidebar('accounts')}"></div>
        </div>

        <main class="col-md-9 col-lg-10 ms-sm-auto px-md-4 py-4">

            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${successMessage}">Success</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold mb-0"><i class="bi bi-bank2 text-info me-2"></i> Bank Account Management & Freeze Controls</h2>
            </div>

            <div class="card card-bank border-0 shadow-sm">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-bank mb-0 align-middle">
                            <thead>
                                <tr>
                                    <th>Account Number</th>
                                    <th>Account Holder</th>
                                    <th>Email</th>
                                    <th>Account Type</th>
                                    <th>Balance ($)</th>
                                    <th>Branch / IFSC</th>
                                    <th>Status</th>
                                    <th class="text-center">Admin Controls</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="acc : ${accounts}">
                                    <td><code class="fw-bold text-dark fs-6" th:text="${acc.accountNumber}">100020003001</code></td>
                                    <td class="fw-bold" th:text="${acc.ownerName}">Customer Name</td>
                                    <td><code th:text="${acc.ownerEmail}">user@bank.com</code></td>
                                    <td><span class="badge bg-secondary" th:text="${acc.accountType}">SAVINGS</span></td>
                                    <td class="fw-bold text-success" th:text="'$' + ${#numbers.formatDecimal(acc.balance, 1, 'COMMA', 2, 'POINT')}">$0.00</td>
                                    <td><small th:text="${acc.branch} + ' (' + ${acc.ifscCode} + ')'">Branch</small></td>
                                    <td>
                                        <span class="badge" th:classappend="${acc.accountStatus.name() == 'ACTIVE'} ? 'bg-success' : 'bg-danger'" th:text="${acc.accountStatus}">ACTIVE</span>
                                    </td>
                                    <td class="text-center">
                                        <div class="d-flex justify-content-center gap-2">
                                            <form th:if="${acc.accountStatus.name() == 'ACTIVE'}" th:action="@{/admin/accounts/{id}/freeze(id=${acc.id})}" method="post">
                                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                                <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-snowflake me-1"></i> Freeze Account</button>
                                            </form>
                                            <form th:if="${acc.accountStatus.name() == 'FROZEN'}" th:action="@{/admin/accounts/{id}/activate(id=${acc.id})}" method="post">
                                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                                <button type="submit" class="btn btn-sm btn-outline-success"><i class="bi bi-play-circle me-1"></i> Activate Account</button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
