<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('500 - System Error')}"></head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-5 text-center">
    <div class="py-5">
        <i class="bi bi-exclamation-octagon text-danger display-1 mb-3 d-block"></i>
        <h1 class="display-4 fw-bold text-dark">500 - Internal Server Error</h1>
        <p class="lead text-muted mb-4" th:text="${message != null ? message : 'An unexpected error occurred while processing your request.'}">System Error</p>
        <a th:href="@{/}" class="btn btn-bank-primary px-4"><i class="bi bi-house me-1"></i> Return to Homepage</a>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
