<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Secure Customer Login')}"></head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card card-bank border-0 shadow-lg mt-4">
                <div class="card-header bg-dark text-white text-center py-4 rounded-top">
                    <i class="bi bi-shield-lock-fill fs-1 text-info"></i>
                    <h3 class="fw-bold mb-0 mt-2">Sign In to Apex Banking</h3>
                    <small class="text-light opacity-75">Secure Online Banking Portal</small>
                </div>
                <div class="card-body p-4">

                    <!-- Flash Messages -->
                    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${errorMessage}">Error</span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                        <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${successMessage}">Success</span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <form th:action="@{/login}" method="post">
                        <!-- CSRF Token -->
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" id="email" name="email" placeholder="name@bank.com" required autofocus>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                                <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="remember-me" name="remember-me">
                                <label class="form-check-label text-muted" for="remember-me">Remember me</label>
                            </div>
                            <a href="#" onclick="alert('Please contact bank customer care at 1-800-555-0100 for password reset.')" class="text-decoration-none text-info small">Forgot password?</a>
                        </div>

                        <button type="submit" class="btn btn-bank-primary w-100 py-2 fs-6 mb-3">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Login to Account
                        </button>
                    </form>

                    <div class="text-center mt-3 border-top pt-3">
                        <span class="text-muted">Don't have an account?</span>
                        <a th:href="@{/register}" class="fw-bold text-info text-decoration-none ms-1">Register Now</a>
                    </div>
                </div>
            </div>

            <!-- Demo Credentials Helper -->
            <div class="card mt-3 bg-white border-0 shadow-sm p-3">
                <small class="text-muted fw-bold mb-1 d-block"><i class="bi bi-info-circle text-info me-1"></i> Pre-Loaded Demo Login Credentials:</small>
                <div class="small">
                    <div><strong>Admin:</strong> <code>dev@bank.com</code> / <code>Dev@123</code></div>
                    <div><strong>Customer 1:</strong> <code>basu@bank.com</code> / <code>Basu@123</code></div>
                    <div><strong>Customer 2:</strong> <code>bharath@bank.com</code> / <code>Bharath@123</code></div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
