# Application Configuration
spring.application.name=Online Banking System
server.port=8080

# Spring Profiles
# Active profile can be switched to 'dev' for embedded H2 database or 'mysql' for MySQL 8
spring.profiles.active=dev

# Thymeleaf Cache (disable for development)
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Multipart / File Upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Logging Configuration
logging.level.root=INFO
logging.level.com.banking=DEBUG
logging.level.org.springframework.security=INFO
logging.file.name=logs/banking-system.log

# Custom Banking Properties
banking.app.name=Apex Online Bank
banking.app.ifsc-prefix=APEX000
banking.app.default-branch=Main Financial District Branch
