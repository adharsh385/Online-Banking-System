<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Transfer Funds')}"></head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-3 col-lg-2 p-0">
            <div th:replace="~{fragments/sidebar :: customerSidebar('transfer')}"></div>
        </div>

        <main class="col-md-9 col-lg-10 ms-sm-auto px-md-4 py-4">

            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${errorMessage}">Error</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card card-bank p-4">
                        <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
                            <h3 class="fw-bold mb-0"><i class="bi bi-arrow-left-right text-info me-2"></i> Instant Money Transfer</h3>
                            <div class="text-end">
                                <small class="text-muted d-block">Available Balance</small>
                                <span class="fw-bold text-success fs-5" th:text="'$' + ${#numbers.formatDecimal(account.balance, 1, 'COMMA', 2, 'POINT')}">$0.00</span>
                            </div>
                        </div>

                        <form id="transferForm" th:action="@{/customer/transfer}" th:object="${transferRequestDto}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                            <div class="mb-3">
                                <label for="recipientAccountNumber" class="form-label fw-semibold">Recipient Account Number *</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
                                    <input type="text" th:field="*{recipientAccountNumber}" class="form-control" id="recipientAccountNumber" placeholder="Enter 12-digit Account Number (e.g. 100020003002)" required>
                                </div>
                                <div class="form-text text-muted">Example target customer account: <code>100020003002</code> (Bharath Kumar)</div>
                            </div>

                            <div class="mb-3">
                                <label for="amount" class="form-label fw-semibold">Transfer Amount ($) *</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-currency-dollar"></i></span>
                                    <input type="number" step="0.01" min="1.00" th:field="*{amount}" class="form-control" id="amount" placeholder="0.00" required>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="remarks" class="form-label fw-semibold">Remarks / Payment Purpose</label>
                                <input type="text" th:field="*{remarks}" class="form-control" id="remarks" placeholder="e.g. Rent payment, Bill split, Consulting fee">
                            </div>

                            <button type="submit" class="btn btn-bank-primary w-100 py-2 fs-5">
                                <i class="bi bi-send-check me-1"></i> Review & Execute Transfer
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- Transfer Confirmation Modal -->
<div class="modal fade" id="transferConfirmModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-dark text-white">
                <h5 class="modal-title fw-bold"><i class="bi bi-shield-check text-info me-2"></i> Confirm Money Transfer</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <p>Are you sure you want to authorize this transaction?</p>
                <div class="bg-light p-3 rounded border mb-3">
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">Target Account:</span>
                        <strong id="modalRecipientAcc">--</strong>
                    </div>
                    <div class="d-flex justify-content-between">
                        <span class="text-muted">Transfer Amount:</span>
                        <strong id="modalTransferAmount" class="text-success fs-5">--</strong>
                    </div>
                </div>
                <small class="text-muted"><i class="bi bi-info-circle me-1"></i> Funds will be debited immediately from your balance.</small>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" id="executeTransferModalBtn" class="btn btn-success fw-bold px-4">Confirm & Send Funds</button>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
