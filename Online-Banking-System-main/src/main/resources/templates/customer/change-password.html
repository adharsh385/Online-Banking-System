<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Change Password')}"></head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-3 col-lg-2 p-0">
            <div th:replace="~{fragments/sidebar :: customerSidebar('password')}"></div>
        </div>

        <main class="col-md-9 col-lg-10 ms-sm-auto px-md-4 py-4">

            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${successMessage}">Success</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${errorMessage}">Error</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="row justify-content-center">
                <div class="col-lg-6">
                    <div class="card card-bank p-4">
                        <h3 class="fw-bold mb-4"><i class="bi bi-shield-lock text-info me-2"></i> Change Account Password</h3>

                        <form th:action="@{/customer/change-password}" th:object="${changePasswordDto}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                            <div class="mb-3">
                                <label for="currentPassword" class="form-label fw-semibold">Current Password *</label>
                                <input type="password" th:field="*{currentPassword}" class="form-control" id="currentPassword" required>
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label fw-semibold">New Password *</label>
                                <input type="password" th:field="*{newPassword}" class="form-control" id="password" required>
                                <small class="text-muted">Must contain 8+ characters, 1 uppercase, 1 lowercase, 1 digit & 1 special character.</small>
                            </div>

                            <div class="mb-4">
                                <label for="confirmPassword" class="form-label fw-semibold">Confirm New Password *</label>
                                <input type="password" th:field="*{confirmPassword}" class="form-control" id="confirmPassword" required>
                                <div id="passwordMatchMsg"></div>
                            </div>

                            <button type="submit" class="btn btn-bank-primary w-100 py-2">
                                <i class="bi bi-key me-1"></i> Update Password
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
