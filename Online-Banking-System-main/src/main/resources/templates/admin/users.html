<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('User Management')}"></head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container-fluid">
    <div class="row">
        <div class="col-md-3 col-lg-2 p-0">
            <div th:replace="~{fragments/sidebar :: adminSidebar('users')}"></div>
        </div>

        <main class="col-md-9 col-lg-10 ms-sm-auto px-md-4 py-4">

            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${successMessage}">Success</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold mb-0"><i class="bi bi-people text-info me-2"></i> Customer User Management</h2>
            </div>

            <div class="card card-bank border-0 shadow-sm">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-bank mb-0 align-middle">
                            <thead>
                                <tr>
                                    <th>User ID</th>
                                    <th>Full Name</th>
                                    <th>Email Address</th>
                                    <th>Phone</th>
                                    <th>Roles</th>
                                    <th>Status</th>
                                    <th class="text-center">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="user : ${users}">
                                    <td th:text="${user.id}">1</td>
                                    <td class="fw-bold" th:text="${user.fullName}">Name</td>
                                    <td><code th:text="${user.email}">email@bank.com</code></td>
                                    <td th:text="${user.phone}">+1-800-555</td>
                                    <td>
                                        <span th:each="role : ${user.roles}" 
                                              class="badge me-1" 
                                              th:classappend="${role.name.name() == 'ROLE_ADMIN' ? 'bg-danger' : 'bg-primary'}"
                                              th:text="${role.name}">ROLE_CUSTOMER</span>
                                    </td>
                                    <td>
                                        <span class="badge" th:classappend="${user.enabled} ? 'bg-success' : 'bg-secondary'" th:text="${user.enabled ? 'ACTIVE' : 'DISABLED'}">ACTIVE</span>
                                    </td>
                                    <td class="text-center">
                                        <form th:if="${user.email != 'dev@bank.com'}" th:action="@{/admin/users/{id}/toggle-status(id=${user.id})}" method="post" class="d-inline">
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                            <button type="submit" class="btn btn-sm" th:classappend="${user.enabled} ? 'btn-outline-danger' : 'btn-outline-success'"
                                                    th:text="${user.enabled ? 'Disable User' : 'Enable User'}">Toggle</button>
                                        </form>
                                        <span th:if="${user.email == 'dev@bank.com'}" class="text-muted small">System SuperAdmin</span>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<div th:replace="~{fragments/footer :: scripts}"></div>
</body>
</html>
