<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark navbar-bank sticky-top">
    <div class="container-fluid px-4">
        <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}">
            <i class="bi bi-bank fs-3 text-info"></i>
            <span>Apex <span class="text-info font-weight-light">Bank</span></span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-3">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}"><i class="bi bi-house-door me-1"></i> Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/about}"><i class="bi bi-info-circle me-1"></i> About Us</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/contact}"><i class="bi bi-envelope me-1"></i> Contact</a>
                </li>
            </ul>

            <div class="d-flex align-items-center gap-3">
                <!-- Anonymous / Guest User Links -->
                <div sec:authorize="isAnonymous()" class="d-flex gap-2">
                    <a th:href="@{/login}" class="btn btn-outline-light btn-sm px-3"><i class="bi bi-box-arrow-in-right me-1"></i> Login</a>
                    <a th:href="@{/register}" class="btn btn-info btn-sm px-3 text-white fw-bold"><i class="bi bi-person-plus me-1"></i> Open Account</a>
                </div>

                <!-- Authenticated Customer Links -->
                <div sec:authorize="hasAuthority('ROLE_CUSTOMER')" class="dropdown">
                    <button class="btn btn-dark dropdown-toggle d-flex align-items-center gap-2 border-secondary" type="button" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle fs-5 text-info"></i>
                        <span sec:authentication="name">User</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow">
                        <li><a class="dropdown-item" th:href="@{/customer/dashboard}"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a></li>
                        <li><a class="dropdown-item" th:href="@{/customer/profile}"><i class="bi bi-person me-2"></i> My Profile</a></li>
                        <li><a class="dropdown-item" th:href="@{/customer/account-details}"><i class="bi bi-wallet2 me-2"></i> Account Details</a></li>
                        <li><a class="dropdown-item" th:href="@{/customer/change-password}"><i class="bi bi-shield-lock me-2"></i> Change Password</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item text-danger" th:href="@{/logout}"><i class="bi bi-box-arrow-right me-2"></i> Logout</a></li>
                    </ul>
                </div>

                <!-- Authenticated Admin Links -->
                <div sec:authorize="hasAuthority('ROLE_ADMIN')" class="dropdown">
                    <button class="btn btn-warning dropdown-toggle d-flex align-items-center gap-2 fw-bold text-dark" type="button" data-bs-toggle="dropdown">
                        <i class="bi bi-shield-check fs-5"></i>
                        <span>Admin Console</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow">
                        <li><a class="dropdown-item" th:href="@{/admin/dashboard}"><i class="bi bi-speedometer2 me-2"></i> Dashboard</a></li>
                        <li><a class="dropdown-item" th:href="@{/admin/users}"><i class="bi bi-people me-2"></i> User Management</a></li>
                        <li><a class="dropdown-item" th:href="@{/admin/accounts}"><i class="bi bi-bank2 me-2"></i> Account Management</a></li>
                        <li><a class="dropdown-item" th:href="@{/admin/transactions}"><i class="bi bi-list-check me-2"></i> Transactions</a></li>
                        <li><a class="dropdown-item" th:href="@{/admin/reports}"><i class="bi bi-graph-up-arrow me-2"></i> Reports</a></li>
                        <li><a class="dropdown-item" th:href="@{/admin/audit-logs}"><i class="bi bi-journal-text me-2"></i> Audit Logs</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item text-danger" th:href="@{/logout}"><i class="bi bi-box-arrow-right me-2"></i> Logout</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
